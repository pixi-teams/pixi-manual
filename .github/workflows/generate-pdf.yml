name: Generate PDF Manuals

on:
  push:
    tags:
      - "manual-v*"

permissions:
  contents: write

jobs:
  generate-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Build Next.js
        run: pnpm build

      - name: Start server and generate PDFs
        run: |
          # next.config.ts は GITHUB_ACTIONS 環境で basePath=/pixi-manual を付けるが、
          # export された out/ 自体に basePath のディレクトリは作られない。
          # そのため out/ を _site/pixi-manual/ に置いてからルートを公開する。
          # （ここを揃えないと PDF 生成が 404 ページを印刷してしまう）
          mkdir -p _site/pixi-manual
          cp -a out/. _site/pixi-manual/
          npx -y serve@latest _site -l 3000 &
          SERVER_PID=$!

          # サーバーの待機は generate-pdf.ts 側で book ページの 200 を確認する
          pnpm pdf

          kill $SERVER_PID

      - name: Sanity check PDFs
        run: |
          # 404 ページを 1 枚だけ出力していた事故の再発防止。
          # 中身が空でないこと（十分なページ数があること）を確認する。
          shopt -s nullglob
          files=(public/manuals/*.pdf)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::PDF が 1 つも生成されていません"
            exit 1
          fi
          for f in "${files[@]}"; do
            pages=$(node -e "
              const fs=require('fs');
              const s=fs.readFileSync(process.argv[1],'latin1');
              const m=[...s.matchAll(/\/Type\s*\/Page[^s]/g)];
              console.log(m.length);
            " "$f")
            echo "$f: ${pages} pages"
            if [ "$pages" -lt 5 ]; then
              echo "::error::$f のページ数が ${pages} しかありません（404 ページを印刷した可能性）"
              exit 1
            fi
          done

      - name: Upload PDFs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pixi-manuals
          path: public/manuals/*.pdf

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: public/manuals/*.pdf
          generate_release_notes: true
